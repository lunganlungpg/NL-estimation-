[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlsfit"
version = "1.0.0"
description = "Nonlinear least squares with Gauss–Newton and Levenberg–Marquardt: readable solvers, full statistical inference, NIST-verified."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "lunganlungpg" }]
keywords = ["nonlinear regression", "least squares", "gauss-newton", "levenberg-marquardt", "curve fitting", "statistics", "education"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
excel = ["pandas>=1.5", "openpyxl>=3.1"]
dev = ["pytest>=7", "ruff>=0.4"]
all = ["matplotlib>=3.6", "pandas>=1.5", "openpyxl>=3.1", "pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://lunganlungpg.github.io/NL-estimation-/"
Source = "https://github.com/lunganlungpg/NL-estimation-"
Documentation = "https://github.com/lunganlungpg/NL-estimation-/blob/main/docs/theory.md"

[tool.setuptools]
packages = ["nlsfit"]

[tool.pytest.ini_options]
testpaths = ["tests", "nlsfit", "README.md"]
addopts = "--doctest-modules --doctest-glob=README.md -q"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]
