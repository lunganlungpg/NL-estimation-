name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[all]"
      - name: Tests (including NIST accuracy) and doctests
        run: pytest
      - name: Run every example
        working-directory: examples
        run: for f in 0*.py; do echo "::group::$f"; python "$f"; echo "::endgroup::"; done
      - name: Data files are up to date with the package
        run: |
          python scripts/build_data.py
          git diff --exit-code -- data/*.csv
